<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 214" width="800" height="214" role="img" aria-labelledby="title desc">
  <title id="title">Full-Stack &amp; AI Infrastructure Engineer</title>
  <desc id="desc">Animated diagram. A stream of events moves along a fast path through a cheap gate. Only anomalies drop out of the gate into an LLM box and continue along a slower, expensive path.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .title { font-size: 28px; font-weight: 700; fill: #f0f6fc; }
    .sub { font-size: 14px; fill: #9198a1; }
    .label { font-size: 12px; fill: #9198a1; }
    .box-label { font-size: 13px; font-weight: 600; fill: #f0f6fc; text-anchor: middle; }
    .lane { stroke: #3d444d; stroke-width: 2; fill: none; stroke-linecap: round; }
    .branch { stroke: #3d444d; stroke-width: 2; stroke-dasharray: 4 5; fill: none; }
    .box { fill: #151b23; stroke-width: 2; }
    .gate { stroke: #4493f8; }
    .llm { stroke: #3d444d; }
    .dot { fill: #4493f8; }
    .anomaly { fill: #d29922; }

    .fast { animation: fast 3.2s linear infinite both; }
    .f1 { animation-delay: 0s; transform: translate(120px, 112px); }
    .f2 { animation-delay: -0.8s; transform: translate(220px, 112px); }
    .f3 { animation-delay: -1.6s; transform: translate(520px, 112px); }
    .f4 { animation-delay: -2.4s; transform: translate(660px, 112px); }
    .anomaly { animation: anomaly 9.6s linear infinite both; animation-delay: -0.4s; transform: translate(580px, 184px); }
    .gate { animation: gate 9.6s linear infinite both; animation-delay: -0.4s; }
    .llm { animation: llm 9.6s linear infinite both; animation-delay: -0.4s; }

    @keyframes fast {
      0%   { transform: translate(20px, 112px); opacity: 0; }
      4%   { opacity: 1; }
      96%  { opacity: 1; }
      100% { transform: translate(775px, 112px); opacity: 0; }
    }
    @keyframes anomaly {
      0%    { transform: translate(20px, 112px); opacity: 0; fill: #4493f8; }
      2%    { opacity: 1; }
      14.8% { transform: translate(355px, 112px); fill: #4493f8; }
      17%   { transform: translate(355px, 112px); fill: #d29922; }
      21%   { transform: translate(355px, 184px); }
      52%   { transform: translate(355px, 184px); }
      96%   { transform: translate(775px, 184px); opacity: 1; fill: #d29922; }
      100%  { transform: translate(775px, 184px); opacity: 0; fill: #d29922; }
    }
    @keyframes gate {
      0%, 14%   { stroke: #4493f8; }
      15.5%, 21% { stroke: #d29922; }
      23%, 100% { stroke: #4493f8; }
    }
    @keyframes llm {
      0%, 19%   { stroke: #3d444d; }
      21%, 52%  { stroke: #d29922; }
      56%, 100% { stroke: #3d444d; }
    }
    @media (prefers-reduced-motion: reduce) {
      .fast, .anomaly, .gate, .llm { animation: none; }
      .llm { stroke: #d29922; }
    }
  </style>

  <text class="title" x="20" y="40">Full-Stack &amp; AI Infrastructure Engineer</text>
  <text class="sub" x="20" y="64">a cheap, fast decision in front of an expensive, slow one</text>

  <text class="label" x="20" y="100">stream</text>
  <text class="label" x="430" y="100">fast path</text>
  <text class="label" x="367" y="152">anomalies only</text>
  <text class="label" x="430" y="172">expensive, slow path</text>

  <path class="lane" d="M20 112 H300 M410 112 H775"/>
  <path class="lane" d="M770 107 L780 112 L770 117"/>
  <path class="branch" d="M355 130 V166"/>
  <path class="lane" d="M410 184 H775"/>
  <path class="lane" d="M770 179 L780 184 L770 189"/>

  <circle class="dot fast f1" r="5" cx="0" cy="0"/>
  <circle class="dot fast f2" r="5" cx="0" cy="0"/>
  <circle class="dot fast f3" r="5" cx="0" cy="0"/>
  <circle class="dot fast f4" r="5" cx="0" cy="0"/>
  <circle class="anomaly" r="6" cx="0" cy="0"/>

  <rect class="box gate" x="300" y="94" width="110" height="36" rx="6"/>
  <text class="box-label" x="355" y="116">cheap gate</text>
  <rect class="box llm" x="300" y="166" width="110" height="36" rx="6"/>
  <text class="box-label" x="355" y="189">LLM</text>
</svg>
